name: "Study Notes"
description: "Creates structured study notes with bullet points and key definitions."
version: "1.0"
prompt: >
  You are an expert study assistant. Create structured study notes based on the following YouTube video transcript. 
  Include bullet points, key definitions, important dates or names, and summarize the core concepts discussed.

  At the very end of your response, provide 3-5 tags for this content, preceded by the keyword [TAGS]:
  Example: [TAGS]: AI, machine learning, transformers
